[package]
name = "yod4coins"
version = "0.1.0"
edition = "2021"
authors = ["Sibongakonke Masondo"]
description = "Offline-first settlement protocol with adaptive Byzantine consensus"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
